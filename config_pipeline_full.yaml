pipeline:
  metadata:
    name: full-production-video-pipeline
    description: Full production-style pipeline with ASR, OCR, translation, TTS, and rendering
  defaults:
    output_dir: outputs
    language: auto
    target_language: vi
    voice: default
  steps:
    - name: DownloadStep
      enabled: true
      config:
        output_dir: downloads
        timeout: 120
    - name: ExtractAudioStep
      enabled: false
      config:
        output_dir: outputs
    - name: ASRStep
      enabled: true
      config:
        engine: whisper
        language: auto
        model: base
    - name: OCRStep
      enabled: true
      config:
        engine: paddleocr
        language: ch
        crop_bottom_ratio: 0.15
    - name: TranslateStep
      enabled: true
      config:
        target_language: vi
        preserve_timing: true
    - name: SubtitleStep
      enabled: true
      config:
        target: vi
    - name: TranslationStep
      enabled: true
      config:
        provider: openrouter
        target_language: vi
        model: google/gemini-2.5-flash-lite
        api_key: ${OPENROUTER_API_KEY}
        enabled: true
    - name: TTSStep
      enabled: true
      config:
        engine: edge-tts
        voice: default
        speed: 1.0
    - name: FFmpegStep
      enabled: true
      config:
        output_dir: outputs
        codec: libx264
        audio_codec: aac
    - name: WatermarkStep
      enabled: false
      config:
        logo_path: assets/logo.png
