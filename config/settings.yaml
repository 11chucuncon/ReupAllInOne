app:
  max_workers: 3
  temp_dir: "temp"
  output_dir: "outputs"

whisper:
  model_size: "small"
  device: "cuda"
  compute_type: "float16"

openrouter:
  api_key: "YOUR_OPENROUTER_API_KEY"
  model_name: "deepseek/deepseek-v4-flash"
  prompt_template: "Hãy viết lại kịch bản sau đây theo phong cách cuốn hút, giữ nguyên ý chính nhưng đổi câu từ để tránh trùng lặp nội dung. Chỉ trả về văn bản kịch bản mới:"

gemini:
  api_key: "YOUR_OPENROUTER_API_KEY"
  model_name: "deepseek/deepseek-v4-flash"
  prompt_template: "Hãy viết lại kịch bản sau đây theo phong cách cuốn hút, giữ nguyên ý chính nhưng đổi câu từ để tránh trùng lặp nội dung. Chỉ trả về văn bản kịch bản mới:"

tts:
  default_voice: "vi-VN-HoaiMyNeural"
  rate: "+0%"
  volume: "+0%"
  default_engine: "edge"
  xtts_model_name: "tts_models/multilingual/multi-dataset/xtts_v2"

cleaner:
  enabled: true
  sample_rate: 1
  min_logo_area: 400
  inpaint_radius: 3
  inpaint_method: "telea"
  yolo_confidence: 0.35
  yolo_nms_threshold: 0.45
  text_score_threshold: 0.5
  text_nms_threshold: 0.4
  yolo_model: "yolov8n.pt"
  yolo_model_path: "weights/yolov8n.pt"

translation:
  provider: "openrouter"
  target_language: "en"
  api_key: "YOUR_OPENROUTER_API_KEY"
  model: "deepseek/deepseek-v4-flash"
  openrouter_model: "deepseek/deepseek-v4-flash"
  local_model: "Helsinki-NLP/opus-mt-en-vi"

inpaint:
  enabled: true
  model: "ProPainter"
  mask_strategy: "subtitle"

subtitle:
  font: "Noto Sans"
  size: 32
  color: "#FFFFFF"
  border: "#000000"
  shadow: "#000000"
  position: "bottom"

ffmpeg:
  hflip: true
  speed_factor: 1.05
  use_nvenc: true

upscale:
  model_path: "weights/realesr-animevideov3.pth"
  device: "cuda"
  temp_dir: "temp/upscale"
