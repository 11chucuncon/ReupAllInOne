app:
  max_workers: 3
  temp_dir: "temp"
  output_dir: "outputs"

whisper:
  model_size: "small"
  device: "cuda"
  compute_type: "float16"

openrouter:
  api_key: "YOUR_OPENROUTER_API_KEY"
  model_name: "deepseek/deepseek-v4-flash"
  prompt_template: "Hãy viết lại kịch bản sau đây theo phong cách cuốn hút, giữ nguyên ý chính nhưng đổi câu từ để tránh trùng lặp nội dung. Chỉ trả về văn bản kịch bản mới:"

gemini:
  api_key: "YOUR_OPENROUTER_API_KEY"
  model_name: "deepseek/deepseek-v4-flash"
  prompt_template: "Hãy viết lại kịch bản sau đây theo phong cách cuốn hút, giữ nguyên ý chính nhưng đổi câu từ để tránh trùng lặp nội dung. Chỉ trả về văn bản kịch bản mới:"

tts:
  default_voice: "vi-VN-HoaiMyNeural"
  rate: "+0%"
  volume: "+0%"
  default_engine: "edge"
  xtts_model_name: "tts_models/multilingual/multi-dataset/xtts_v2"

ocr:
  languages: ["vi", "en", "zh", "ja", "ko"]
  sample_rate: 1

translation:
  provider: "local"
  target_language: "en"
  model: "Helsinki-NLP/opus-mt-en-vi"

inpaint:
  enabled: true
  model: "ProPainter"
  mask_strategy: "subtitle"

subtitle:
  font: "Noto Sans"
  size: 32
  color: "#FFFFFF"
  border: "#000000"
  shadow: "#000000"
  position: "bottom"

ffmpeg:
  hflip: true
  speed_factor: 1.05
  use_nvenc: true

upscale:
  model_path: "weights/realesr-animevideov3.pth"
  device: "cuda"
  temp_dir: "temp/upscale"
